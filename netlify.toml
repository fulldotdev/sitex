[build]
command = "pnpm run build"
publish = "apps/docs/dist"

[build.environment]
NODE_VERSION = "24"
PNPM_FLAGS = "--frozen-lockfile --ignore-scripts --ignore-pnpmfile"
pnpm_config_ignore_scripts = "true"
pnpm_config_ignore_pnpmfile = "true"

[[redirects]]
from = "/docs/tsx-pages"
to = "/docs/pages"
status = 301

[[redirects]]
from = "/docs/mdx"
to = "/docs/pages"
status = 301

[[redirects]]
from = "/docs/page-routing"
to = "/docs/pages"
status = 301

[[redirects]]
from = "/docs/folder-structure"
to = "/docs/installation"
status = 301

[[redirects]]
from = "/docs/content"
to = "/docs/pages"
status = 301

[[redirects]]
from = "/docs/mdx-components"
to = "/docs/layouts"
status = 301

[[redirects]]
from = "/docs/seo"
to = "/docs/layouts"
status = 301

[[redirects]]
from = "/docs/rendering-and-assets"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/island-rendering"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/rendering"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/ui"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/ui/installation"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/ui/components"
to = "/docs/components"
status = 301

[[redirects]]
from = "/docs/ui/*"
to = "/docs/components/:splat"
status = 301

[context.production]
command = "pnpm run build"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Content-Security-Policy = "frame-ancestors 'self'"

# Build files have a hash in their name, so browsers can keep them.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The Markdown version of every page is for agents, not for search results.
[[headers]]
for = "/*.md"
[headers.values]
X-Robots-Tag = "noindex"

[context.deploy-preview]
ignore = "false"
